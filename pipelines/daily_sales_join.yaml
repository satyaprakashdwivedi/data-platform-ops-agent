# Spark job config read by the scheduler (spark-submit --conf ...). The ops agent proposes changes here via PRs.
pipeline: daily_sales_join
owner: data-platform
schedule: "0 2 * * *"
entrypoint: jobs/daily_sales_join.py
spark_conf:
  spark.executor.memory: 8g
  spark.executor.cores: "8"
  spark.executor.instances: "10"
  spark.driver.memory: 4g
  spark.sql.shuffle.partitions: "200"
  spark.sql.adaptive.enabled: "false"
